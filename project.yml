# XcodeGen spec. Regenerate the Xcode project with:  xcodegen generate
name: SimpleTaskSwitcher

options:
  bundleIdPrefix: dev.simpletaskswitcher
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

targets:
  SimpleTaskSwitcher:
    type: application
    platform: macOS
    sources:
      - path: Sources
    scheme: {}
    settings:
      base:
        PRODUCT_NAME: SimpleTaskSwitcher
        PRODUCT_BUNDLE_IDENTIFIER: dev.simpletaskswitcher.SimpleTaskSwitcher
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        MACOSX_DEPLOYMENT_TARGET: "14.0"

        # Swift
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete

        # Info.plist is generated by Xcode from these keys (no plist file, no storyboard/nib).
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES            # no Dock icon, no app menu bar
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_CFBundleDisplayName: Simple Task Switcher
        INFOPLIST_KEY_NSHumanReadableCopyright: "Open source, personal use."

        # Sandbox off (needs to see/activate other apps), Hardened Runtime on.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES

        # Phase 1: ad-hoc signing (no permissions requested, so a changing cdhash is harmless).
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
